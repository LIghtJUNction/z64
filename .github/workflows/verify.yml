name: Verify an immutable commit

on:
  workflow_call:
    inputs:
      commit:
        description: Full commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  test:
    name: ${{ matrix.runner }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        rust: [stable, '1.89.0']
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-11-09
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Formatting
        if: matrix.rust == 'stable' && matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Debug, release, and documentation tests
        run: |
          cargo test --locked
          cargo test --locked --release
          cargo test --locked --doc
      - name: Scalar, reference, and compile-time dispatch tests
        run: |
          cargo test --locked --release --features force-scalar
          cargo test --locked --release --features reference
          cargo test --locked --release --features no-runtime-detect
      - name: SIMD on supported hardware
        run: bash scripts/test-simd.sh

  no-std:
    name: Bare-metal / Rust ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, '1.89.0']
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Install Rust and bare-metal targets
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target thumbv7em-none-eabi --target aarch64-unknown-none --target x86_64-unknown-none
      - name: Compile without an operating system
        run: |
          for target in thumbv7em-none-eabi aarch64-unknown-none x86_64-unknown-none; do
            cargo build --locked --lib --release --target "$target"
            cargo build --locked --lib --release --target "$target" --all-features
          done

  package:
    name: Dependency and package audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Enforce crate boundaries
        run: python3 scripts/audit.py
      - name: Verify publication archive
        run: |
          cargo package --list --locked
          cargo package --locked
          cargo publish --dry-run --locked

  miri:
    name: Miri / scalar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Install Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Prepare the interpreter
        run: cargo miri setup
      - name: Check scalar memory safety
        run: cargo miri test --locked --features force-scalar --test miri

  comparison:
    name: Differential and smoke / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Comparison formatting and Clippy
        run: |
          rustup component add rustfmt clippy
          cargo fmt --manifest-path comparison/Cargo.toml -- --check
          cargo clippy --manifest-path comparison/Cargo.toml --locked --all-targets -- -D warnings
      - name: Differential tests against independent libraries
        run: cargo test --manifest-path comparison/Cargo.toml --locked
      - name: Benchmark smoke (shared runner, no performance claims)
        run: |
          cargo run --release --manifest-path comparison/Cargo.toml --locked -- --smoke > benchmark-smoke.csv
          rustc -Vv > benchmark-environment.txt
          uname -a >> benchmark-environment.txt
          cargo tree --manifest-path comparison/Cargo.toml --locked >> benchmark-environment.txt
          lscpu >> benchmark-environment.txt
      - name: Retain smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified 2026-11-09
        with:
          name: benchmark-smoke-${{ matrix.runner }}
          path: |
            benchmark-smoke.csv
            benchmark-environment.txt
            comparison/Cargo.lock
          if-no-files-found: error
          retention-days: 14
