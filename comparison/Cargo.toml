[package]
name = "z64-comparison"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]

[features]
force-scalar = ["z64/force-scalar"]
reference = ["z64/reference"]
no-runtime-detect = ["z64/no-runtime-detect"]
no-short-path = ["z64/no-short-path"]
no-avx512 = ["z64/no-avx512"]

[dependencies]
z64 = { path = ".." }
z64-before = { package = "z64", git = "https://github.com/LIghtJUNction/z64", rev = "cda77a6bd866be19831decc420e95a5a5bd79e75" }
base64 = "=0.23.1"
base64-simd = "=0.8.0"
base64-turbo = "=0.6.0"
encodify = "=1.0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

